<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
<rect width="100%" height="100%" fill="#f1f5f9"/>
<rect width="100%" height="72" fill="#0f172a"/><text x="52" y="46" fill="white" font-family="Segoe UI,Arial" font-size="27" font-weight="700">KoDes Retail — Relational ERD</text>
<text x="52" y="102" fill="#475569" font-family="Segoe UI,Arial" font-size="17">Four entities • inventory attributes merged into PRODUCT • no primary key on INVOICE_LINE</text>

<!-- CUSTOMER to INVOICE: one customer may place zero or many invoices -->
<path d="M 680 280 L 920 280" stroke="#334155" stroke-width="2.5" fill="none"/>
<line x1="694" y1="270" x2="694" y2="290" stroke="#334155" stroke-width="2.5"/><line x1="701" y1="270" x2="701" y2="290" stroke="#334155" stroke-width="2.5"/>
<circle cx="899" cy="280" r="5" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<path d="M 899 280 L 914 269 M 899 280 L 914 280 M 899 280 L 914 291" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="755" y="263" width="90" height="32" rx="6" fill="white" stroke="#cbd5e1"/><text x="800" y="284" text-anchor="middle" fill="#334155" font-family="Segoe UI,Arial" font-size="14">places</text>

<!-- INVOICE to INVOICE_LINE: each detail belongs to one invoice; invoice has one or more details -->
<path d="M 1225 398 L 1225 650" stroke="#334155" stroke-width="2.5" fill="none"/>
<line x1="1215" y1="411" x2="1235" y2="411" stroke="#334155" stroke-width="2.5"/><line x1="1215" y1="418" x2="1235" y2="418" stroke="#334155" stroke-width="2.5"/>
<line x1="1215" y1="632" x2="1235" y2="632" stroke="#334155" stroke-width="2.5"/>
<path d="M 1213 650 L 1225 635 L 1237 650" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="1172" y="500" width="106" height="32" rx="6" fill="white" stroke="#cbd5e1"/><text x="1225" y="521" text-anchor="middle" fill="#334155" font-family="Segoe UI,Arial" font-size="14">contains</text>

<!-- PRODUCT to INVOICE_LINE: a product may appear on zero or many details -->
<path d="M 680 800 L 920 800" stroke="#334155" stroke-width="2.5" fill="none"/>
<line x1="694" y1="790" x2="694" y2="810" stroke="#334155" stroke-width="2.5"/><line x1="701" y1="790" x2="701" y2="810" stroke="#334155" stroke-width="2.5"/>
<circle cx="899" cy="800" r="5" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<path d="M 899 800 L 914 789 M 899 800 L 914 800 M 899 800 L 914 811" stroke="#334155" stroke-width="2.5" fill="none"/>
<rect x="752" y="783" width="96" height="32" rx="6" fill="white" stroke="#cbd5e1"/><text x="800" y="804" text-anchor="middle" fill="#334155" font-family="Segoe UI,Arial" font-size="14">appears on</text>
<g filter="url(#shadow)"><rect x="70" y="120" width="610" height="358" rx="9" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><path d="M79 120 H671 Q680 120 680 129 V162 H70 V129 Q70 120 79 120" fill="#1e293b"/><text x="94" y="149" fill="white" font-family="Segoe UI,Arial" font-size="17" font-weight="700">CUSTOMER</text></g><rect x="71" y="162" width="608" height="40" fill="#f8fafc"/><rect x="86" y="171" width="35" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="103.5" y="186" text-anchor="middle" fill="#92400e" font-family="Segoe UI,Arial" font-size="10" font-weight="700">PK</text><text x="135" y="188" fill="#1e293b" font-family="Consolas,monospace" font-size="15">customer_id</text><text x="660" y="188" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(10)</text><line x1="71" y1="202" x2="679" y2="202" stroke="#e2e8f0"/><rect x="71" y="202" width="608" height="40" fill="#ffffff"/><text x="92" y="228" fill="#1e293b" font-family="Consolas,monospace" font-size="15">customer_name</text><text x="660" y="228" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(100)</text><line x1="71" y1="242" x2="679" y2="242" stroke="#e2e8f0"/><rect x="71" y="242" width="608" height="40" fill="#f8fafc"/><rect x="86" y="251" width="35" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="103.5" y="266" text-anchor="middle" fill="#166534" font-family="Segoe UI,Arial" font-size="10" font-weight="700">UQ</text><text x="135" y="268" fill="#1e293b" font-family="Consolas,monospace" font-size="15">email</text><text x="660" y="268" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(150)</text><line x1="71" y1="282" x2="679" y2="282" stroke="#e2e8f0"/><rect x="71" y="282" width="608" height="40" fill="#ffffff"/><text x="92" y="308" fill="#1e293b" font-family="Consolas,monospace" font-size="15">phone_number</text><text x="660" y="308" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(30)</text><line x1="71" y1="322" x2="679" y2="322" stroke="#e2e8f0"/><rect x="71" y="322" width="608" height="40" fill="#f8fafc"/><text x="92" y="348" fill="#1e293b" font-family="Consolas,monospace" font-size="15">address</text><text x="660" y="348" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(200)</text><line x1="71" y1="362" x2="679" y2="362" stroke="#e2e8f0"/><rect x="71" y="362" width="608" height="40" fill="#ffffff"/><text x="92" y="388" fill="#1e293b" font-family="Consolas,monospace" font-size="15">city</text><text x="660" y="388" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(100)</text><line x1="71" y1="402" x2="679" y2="402" stroke="#e2e8f0"/><rect x="71" y="402" width="608" height="40" fill="#f8fafc"/><text x="92" y="428" fill="#1e293b" font-family="Consolas,monospace" font-size="15">customer_type</text><text x="660" y="428" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(20)</text><line x1="71" y1="442" x2="679" y2="442" stroke="#e2e8f0"/><rect x="71" y="442" width="608" height="40" fill="#ffffff"/><text x="92" y="468" fill="#1e293b" font-family="Consolas,monospace" font-size="15">country</text><text x="660" y="468" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(60)</text><g filter="url(#shadow)"><rect x="920" y="120" width="610" height="278" rx="9" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><path d="M929 120 H1521 Q1530 120 1530 129 V162 H920 V129 Q920 120 929 120" fill="#1e293b"/><text x="944" y="149" fill="white" font-family="Segoe UI,Arial" font-size="17" font-weight="700">INVOICE</text></g><rect x="921" y="162" width="608" height="40" fill="#f8fafc"/><rect x="936" y="171" width="35" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="953.5" y="186" text-anchor="middle" fill="#92400e" font-family="Segoe UI,Arial" font-size="10" font-weight="700">PK</text><text x="985" y="188" fill="#1e293b" font-family="Consolas,monospace" font-size="15">invoice_no</text><text x="1510" y="188" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(20)</text><line x1="921" y1="202" x2="1529" y2="202" stroke="#e2e8f0"/><rect x="921" y="202" width="608" height="40" fill="#ffffff"/><text x="942" y="228" fill="#1e293b" font-family="Consolas,monospace" font-size="15">invoice_date</text><text x="1510" y="228" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">TIMESTAMP</text><line x1="921" y1="242" x2="1529" y2="242" stroke="#e2e8f0"/><rect x="921" y="242" width="608" height="40" fill="#f8fafc"/><rect x="936" y="251" width="35" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="953.5" y="266" text-anchor="middle" fill="#075985" font-family="Segoe UI,Arial" font-size="10" font-weight="700">FK</text><text x="985" y="268" fill="#1e293b" font-family="Consolas,monospace" font-size="15">customer_id</text><text x="1510" y="268" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(10)</text><line x1="921" y1="282" x2="1529" y2="282" stroke="#e2e8f0"/><rect x="921" y="282" width="608" height="40" fill="#ffffff"/><text x="942" y="308" fill="#1e293b" font-family="Consolas,monospace" font-size="15">country</text><text x="1510" y="308" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(60)</text><line x1="921" y1="322" x2="1529" y2="322" stroke="#e2e8f0"/><rect x="921" y="322" width="608" height="40" fill="#f8fafc"/><text x="942" y="348" fill="#1e293b" font-family="Consolas,monospace" font-size="15">status</text><text x="1510" y="348" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(20)</text><line x1="921" y1="362" x2="1529" y2="362" stroke="#e2e8f0"/><rect x="921" y="362" width="608" height="40" fill="#ffffff"/><text x="942" y="388" fill="#1e293b" font-family="Consolas,monospace" font-size="15">payment_method</text><text x="1510" y="388" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(20)</text><g filter="url(#shadow)"><rect x="70" y="650" width="610" height="318" rx="9" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><path d="M79 650 H671 Q680 650 680 659 V692 H70 V659 Q70 650 79 650" fill="#1e293b"/><text x="94" y="679" fill="white" font-family="Segoe UI,Arial" font-size="17" font-weight="700">PRODUCT</text></g><rect x="71" y="692" width="608" height="40" fill="#f8fafc"/><rect x="86" y="701" width="35" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="103.5" y="716" text-anchor="middle" fill="#92400e" font-family="Segoe UI,Arial" font-size="10" font-weight="700">PK</text><text x="135" y="718" fill="#1e293b" font-family="Consolas,monospace" font-size="15">stock_code</text><text x="660" y="718" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(30)</text><line x1="71" y1="732" x2="679" y2="732" stroke="#e2e8f0"/><rect x="71" y="732" width="608" height="40" fill="#ffffff"/><text x="92" y="758" fill="#1e293b" font-family="Consolas,monospace" font-size="15">description</text><text x="660" y="758" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(255)</text><line x1="71" y1="772" x2="679" y2="772" stroke="#e2e8f0"/><rect x="71" y="772" width="608" height="40" fill="#f8fafc"/><text x="92" y="798" fill="#1e293b" font-family="Consolas,monospace" font-size="15">category</text><text x="660" y="798" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(50)</text><line x1="71" y1="812" x2="679" y2="812" stroke="#e2e8f0"/><rect x="71" y="812" width="608" height="40" fill="#ffffff"/><text x="92" y="838" fill="#1e293b" font-family="Consolas,monospace" font-size="15">current_unit_price</text><text x="660" y="838" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">DECIMAL(10,2)</text><line x1="71" y1="852" x2="679" y2="852" stroke="#e2e8f0"/><rect x="71" y="852" width="608" height="40" fill="#f8fafc"/><text x="92" y="878" fill="#1e293b" font-family="Consolas,monospace" font-size="15">stock_level</text><text x="660" y="878" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">INT</text><line x1="71" y1="892" x2="679" y2="892" stroke="#e2e8f0"/><rect x="71" y="892" width="608" height="40" fill="#ffffff"/><text x="92" y="918" fill="#1e293b" font-family="Consolas,monospace" font-size="15">reorder_level</text><text x="660" y="918" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">INT</text><line x1="71" y1="932" x2="679" y2="932" stroke="#e2e8f0"/><rect x="71" y="932" width="608" height="40" fill="#f8fafc"/><text x="92" y="958" fill="#1e293b" font-family="Consolas,monospace" font-size="15">last_updated</text><text x="660" y="958" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">TIMESTAMP</text><g filter="url(#shadow)"><rect x="920" y="650" width="610" height="198" rx="9" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><path d="M929 650 H1521 Q1530 650 1530 659 V692 H920 V659 Q920 650 929 650" fill="#1e293b"/><text x="944" y="679" fill="white" font-family="Segoe UI,Arial" font-size="17" font-weight="700">INVOICE_LINE</text></g><rect x="921" y="692" width="608" height="40" fill="#f8fafc"/><rect x="936" y="701" width="35" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="953.5" y="716" text-anchor="middle" fill="#075985" font-family="Segoe UI,Arial" font-size="10" font-weight="700">FK</text><text x="985" y="718" fill="#1e293b" font-family="Consolas,monospace" font-size="15">invoice_no</text><text x="1510" y="718" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(20)</text><line x1="921" y1="732" x2="1529" y2="732" stroke="#e2e8f0"/><rect x="921" y="732" width="608" height="40" fill="#ffffff"/><rect x="936" y="741" width="35" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7"/><text x="953.5" y="756" text-anchor="middle" fill="#075985" font-family="Segoe UI,Arial" font-size="10" font-weight="700">FK</text><text x="985" y="758" fill="#1e293b" font-family="Consolas,monospace" font-size="15">stock_code</text><text x="1510" y="758" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">VARCHAR(30)</text><line x1="921" y1="772" x2="1529" y2="772" stroke="#e2e8f0"/><rect x="921" y="772" width="608" height="40" fill="#f8fafc"/><text x="942" y="798" fill="#1e293b" font-family="Consolas,monospace" font-size="15">quantity</text><text x="1510" y="798" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">INT</text><line x1="921" y1="812" x2="1529" y2="812" stroke="#e2e8f0"/><rect x="921" y="812" width="608" height="40" fill="#ffffff"/><text x="942" y="838" fill="#1e293b" font-family="Consolas,monospace" font-size="15">unit_price_at_sale</text><text x="1510" y="838" text-anchor="end" fill="#64748b" font-family="Consolas,monospace" font-size="14">DECIMAL(10,2)</text>
<text x="70" y="1030" fill="#475569" font-family="Segoe UI,Arial" font-size="14">PK = primary key • FK = foreign key • UQ = unique constraint</text>
<text x="920" y="1030" fill="#475569" font-family="Segoe UI,Arial" font-size="14">Foreign keys preserve references; invoice_line has no row-level key by design.</text>
